name: Generate Technical Skills SVG

on:
  push:
    branches:
      - main
    paths:
      - "generate_skills_svg.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate skills graphic
        run: python generate_skills_svg.py

      - name: Commit generated SVG
        run: |
          if git diff --quiet -- skills-3d-contrib.svg; then
            echo "SVG is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills-3d-contrib.svg
          git commit -m "Update generated 3D technical skills graphic"
          git push
