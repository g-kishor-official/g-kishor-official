name: Generate-Skills-3D

on:
  workflow_dispatch:
  push:
    paths:
      - "generate_skills_svg.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate skills SVG
        run: python generate_skills_svg.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills-3d-contrib.svg
          git commit -m "update skills 3D graph" || exit 0
          git push
